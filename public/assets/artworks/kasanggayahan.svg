<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <radialGradient id="copperFest" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="40%" stop-color="#7C2D12"/>
      <stop offset="80%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </radialGradient>
    <linearGradient id="goldCopperStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#copperFest)"/>

  <!-- Geometric Festival Chevrons -->
  <polygon points="600,200 1100,600 950,750 600,450 250,750 100,600" fill="url(#goldCopperStripe)"/>
  <polygon points="600,600 1100,1000 950,1150 600,850 250,1150 100,1000" fill="#FF4D2E" opacity="0.9"/>
  <polygon points="600,1000 1100,1400 950,1550 600,1250 250,1550 100,1400" fill="#D4FF3F" opacity="0.85"/>

  <!-- Crosshatch Metallic Strands -->
  <g stroke="#FDE047" stroke-width="2" opacity="0.35">
    <line x1="200" y1="300" x2="1000" y2="1300"/>
    <line x1="1000" y1="300" x2="200" y2="1300"/>
  </g>

  <text x="80" y="1520" fill="#FBFBFF" opacity="0.3" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" letter-spacing="6">
    E-YHAN // KASANGGAYAHAN HYPERCHROME
  </text>
  <text x="80" y="1560" fill="#EA580C" opacity="0.6" font-family="'Space Grotesk', sans-serif" font-size="16" letter-spacing="4">
    COPPER DUST &amp; ENAMEL ON HEAVY LINEN
  </text>
</svg>
