<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <linearGradient id="charcoalAsh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#charcoalAsh)"/>

  <!-- Left Panel -->
  <rect x="60" y="80" width="510" height="1400" fill="#1C1C24" stroke="#2A2A38" stroke-width="2"/>
  <!-- Right Panel -->
  <rect x="630" y="80" width="510" height="1400" fill="#1C1C24" stroke="#2A2A38" stroke-width="2"/>

  <!-- Central Fault Fracture Line -->
  <line x1="600" y1="0" x2="600" y2="1600" stroke="#FF4D2E" stroke-width="6" stroke-dasharray="16 8"/>

  <!-- Seismic Collision Vectors Between Left & Right -->
  <polygon points="100,400 570,700 570,850 100,550" fill="#FF4D2E" opacity="0.9"/>
  <polygon points="630,680 1100,380 1100,530 630,830" fill="#D4FF3F" opacity="0.9"/>

  <polygon points="120,900 570,1200 570,1300 120,1000" fill="#FBFBFF" opacity="0.7"/>
  <polygon points="630,1180 1080,880 1080,980 630,1280" fill="#9353D3" opacity="0.8"/>

  <text x="80" y="1520" fill="#FBFBFF" opacity="0.3" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" letter-spacing="6">
    E-YHAN // TECTONIC FRICTION DIPTYCH
  </text>
  <text x="80" y="1560" fill="#D4FF3F" opacity="0.6" font-family="'Space Grotesk', sans-serif" font-size="16" letter-spacing="4">
    PUMICE, CHARCOAL &amp; OIL STICK ON DUAL PANELS
  </text>
</svg>
