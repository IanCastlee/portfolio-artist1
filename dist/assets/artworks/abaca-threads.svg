<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceDark" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E1035"/>
      <stop offset="60%" stop-color="#0F091A"/>
      <stop offset="100%" stop-color="#07040C"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#spaceDark)"/>

  <!-- High Tension Abaca Fiber Lines creating Moiré Patterns -->
  <g stroke="#9353D3" stroke-width="1.5" opacity="0.6">
    <line x1="100" y1="100" x2="1100" y2="1500"/>
    <line x1="150" y1="100" x2="1050" y2="1500"/>
    <line x1="200" y1="100" x2="1000" y2="1500"/>
    <line x1="250" y1="100" x2="950" y2="1500"/>
    <line x1="300" y1="100" x2="900" y2="1500"/>
    <line x1="350" y1="100" x2="850" y2="1500"/>
    <line x1="400" y1="100" x2="800" y2="1500"/>
  </g>

  <g stroke="#D4FF3F" stroke-width="2" opacity="0.7">
    <line x1="1100" y1="100" x2="100" y2="1500"/>
    <line x1="1050" y1="100" x2="150" y2="1500"/>
    <line x1="1000" y1="100" x2="200" y2="1500"/>
    <line x1="950" y1="100" x2="250" y2="1500"/>
    <line x1="900" y1="100" x2="300" y2="1500"/>
    <line x1="850" y1="100" x2="350" y2="1500"/>
  </g>

  <!-- Suspended Kinetic Aluminum Bar Focus -->
  <polygon points="200,750 1000,820 980,880 180,810" fill="#FF4D2E" opacity="0.95"/>

  <text x="80" y="1520" fill="#FBFBFF" opacity="0.3" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" letter-spacing="6">
    E-YHAN // ABACA KINETIC THREADS (SPATIAL)
  </text>
  <text x="80" y="1560" fill="#9353D3" opacity="0.6" font-family="'Space Grotesk', sans-serif" font-size="16" letter-spacing="4">
    TENSIONED SORSOGON ABACA &amp; SUSPENDED ALUMINUM
  </text>
</svg>
